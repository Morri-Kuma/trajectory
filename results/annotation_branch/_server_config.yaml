mode: server
project:
  name: trajectory-annotation-robustness
  root: .
  random_seed: 0
annotation:
  reference_dataset: gse242424
  query_datasets:
  - gse178325
  - gse230659
  reference_label_key: author_cluster_label
  marker_silver_label_key: final_milestone_label_coarse
  confidence_threshold: 0.5
  unlabeled_category: unknown
  correspondence_map:
    Fibroblast: hADSCs
    Fibroblast-like: hADSCs
    Keratinocyte-like: epithelial_like
    Intermediate: epithelial_like
    Partially-reprogrammed: intermediate_plastic
    Pre-iPSC: intermediate_plastic
    iPSC: hCiPS
trajectory:
  methods:
  - dpt
  - paga
  root_state: hADSCs
  n_dcs: 15
  paga_groups: final_milestone_label_coarse
markers:
  pluripotency:
  - POU5F1
  - SOX2
  - NANOG
  - LIN28A
  stromal_fibroblast:
  - COL1A2
  - DCN
  - LUM
  epithelial_met:
  - CDH1
  - EPCAM
  xen:
  - GATA6
  - SOX17
test:
  test_mode: true
  use_small_subset: true
  max_cells_per_dataset: 2000
  max_genes: 2000
  device: cpu
  paths:
    synthetic_dir: results/test_outputs/synthetic
    output_dir: results/test_outputs/annotation_branch
    models_dir: results/test_outputs/models
  scvi:
    use_scvi: false
    n_latent: 30
    scvi_max_epochs: 2
    scanvi_max_epochs: 2
  trajectory:
    n_neighbors: 15
    n_pcs: 30
server:
  test_mode: false
  use_small_subset: false
  max_cells_per_dataset: null
  max_genes: null
  device: cuda
  paths:
    reference_h5ad: results/annotation_branch/inputs/gse242424_ref_fullgene_labelled.h5ad
    query_h5ad:
      gse178325: results/annotation_branch/inputs/gse178325_query_fullgene_labelled.h5ad
      gse230659: results/annotation_branch/inputs/gse230659_query_fullgene_labelled.h5ad
    output_dir: results/annotation_branch
    models_dir: models/scanvi_reference_gse242424
  scvi:
    use_scvi: true
    batch_key: sample_id
    n_latent: 30
    n_layers: 2
    scvi_max_epochs: 300
    scanvi_max_epochs: 50
    reference_recovery_min_accuracy: 0.9
  trajectory:
    n_neighbors: 30
    n_pcs: 50
server_dryrun:
  test_mode: true
  use_small_subset: true
  max_cells_per_dataset: 2000
  max_genes: null
  device: cpu
  paths:
    reference_h5ad: benchmark/inputs/gse242424_author_cluster_matched/GSE242424_author_cluster_matched_HVG2000_benchmark_input.h5ad
    query_h5ad:
      gse178325: benchmark/inputs/gse178325_marker_fm_transition_silver_hvg2000/GSE178325_marker_fm_transition_silver_HVG2000_benchmark_input.h5ad
      gse230659: benchmark/inputs/gse230659_marker_fm_transition_silver_hvg2000/GSE230659_marker_fm_transition_silver_HVG2000_benchmark_input.h5ad
    output_dir: results/test_outputs/server_dryrun
    models_dir: results/test_outputs/models
  scvi:
    use_scvi: false
  trajectory:
    n_neighbors: 15
    n_pcs: 30
