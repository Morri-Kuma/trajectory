# =============================================================================
# config.yaml — single entry point for the annotation-robustness pipeline
# =============================================================================
# The SAME src/ code runs locally and on the server; only `mode` and the
# per-mode block change. Switch `mode` to select the active profile.
#
#   mode: test    -> tiny subset, CPU, fast; proves the pipeline executes
#   mode: server  -> full data, GPU scANVI; produces manuscript results
#
# Nothing here downloads data. Paths point at already-present local files.
# =============================================================================

mode: test                      # test | server

# ---- Global, mode-independent ------------------------------------------------
project:
  name: trajectory-annotation-robustness
  root: "."                     # repo root; resolved relative to this file
  random_seed: 0                # threaded through numpy / torch / scanpy

# ---- Annotation branch ------------------------------------------------------
annotation:
  reference_dataset: gse242424          # labelled reference (OSKM)
  query_datasets: [gse178325, gse230659]
  reference_label_key: author_cluster_label   # author ATAC->RNA clusters (9 states); chosen 2026-06-09. Alt: final_milestone_label_coarse (10)
  marker_silver_label_key: final_milestone_label_coarse
  confidence_threshold: 0.5             # below -> 'unknown_or_ood'
  unlabeled_category: unknown
  # correspondence map used by the comparison metrics (reference -> query)
  correspondence_map:
    Fibroblast: hADSCs
    Fibroblast-like: hADSCs
    Keratinocyte-like: epithelial_like
    Intermediate: epithelial_like
    Partially-reprogrammed: intermediate_plastic
    Pre-iPSC: intermediate_plastic
    iPSC: hCiPS

# ---- Trajectory inference ----------------------------------------------------
trajectory:
  methods: [dpt, paga]          # server adds: slingshot + generative methods
  root_state: hADSCs            # start population for pseudotime anchoring
  n_dcs: 15                     # diffusion components for DPT
  paga_groups: final_milestone_label_coarse

# ---- Marker genes (canonical, for validation) -------------------------------
markers:
  pluripotency: [POU5F1, SOX2, NANOG, LIN28A]
  stromal_fibroblast: [COL1A2, DCN, LUM]
  epithelial_met: [CDH1, EPCAM]
  xen: [GATA6, SOX17]

# =============================================================================
# PROFILE: test  (laptop / this sandbox)
# =============================================================================
test:
  test_mode: true
  use_small_subset: true
  max_cells_per_dataset: 2000
  max_genes: 2000
  device: cpu
  paths:
    # for the smoke test we use synthetic inputs generated by
    # scripts/make_synthetic_smoke_data.py (no large downloads)
    synthetic_dir: "results/test_outputs/synthetic"
    output_dir: "results/test_outputs/annotation_branch"
    models_dir: "results/test_outputs/models"
  scvi:
    use_scvi: false             # KNN-on-PCA surrogate if scvi/torch absent
    n_latent: 30
    scvi_max_epochs: 2
    scanvi_max_epochs: 2
  trajectory:
    n_neighbors: 15
    n_pcs: 30

# =============================================================================
# PROFILE: server  (Shirokane / GPU)
# =============================================================================
server:
  test_mode: false
  use_small_subset: false
  max_cells_per_dataset: null   # null -> use all cells
  max_genes: null               # gene space frozen by the prep step (see NOTE)
  device: cuda
  # IMPORTANT (verified 2026-06-09 dry-run): do NOT use the per-dataset HVG2000
  # inputs directly -- their HVG sets are disjoint (ref∩query ~181-238 genes;
  # all three = 79; canonical markers absent). First build shared-gene-space
  # inputs from the FULL-GENE matrices + joined labels via
  # src/data/build_scanvi_inputs.py (full-gene ref∩q178∩q230 = 17,829 genes,
  # all 11 markers present), then point the paths below at those prep outputs
  # and feed raw counts to scVI.
  paths:
    reference_h5ad: "results/annotation_branch/inputs/gse242424_ref_fullgene_labelled.h5ad"
    query_h5ad:
      gse178325: "results/annotation_branch/inputs/gse178325_query_fullgene_labelled.h5ad"
      gse230659: "results/annotation_branch/inputs/gse230659_query_fullgene_labelled.h5ad"
    output_dir: "results/annotation_branch"
    models_dir: "models/scanvi_reference_gse242424"
  scvi:
    use_scvi: true
    batch_key: sample_id
    n_latent: 30
    n_layers: 2
    scvi_max_epochs: 300
    scanvi_max_epochs: 50
    reference_recovery_min_accuracy: 0.90   # gate before query mapping
  trajectory:
    n_neighbors: 30
    n_pcs: 50

# =============================================================================
# PROFILE: server_dryrun  (real benchmark .h5ad, but 2k-cell subsample on CPU)
# Proves the loader/preprocess/annotation-comparison runs on REAL data without
# scvi/GPU. Uses the KNN surrogate. Same real paths as `server`.
# =============================================================================
server_dryrun:
  test_mode: true
  use_small_subset: true
  max_cells_per_dataset: 2000
  max_genes: null
  device: cpu
  paths:
    reference_h5ad: "benchmark/inputs/gse242424_author_cluster_matched/GSE242424_author_cluster_matched_HVG2000_benchmark_input.h5ad"
    query_h5ad:
      gse178325: "benchmark/inputs/gse178325_marker_fm_transition_silver_hvg2000/GSE178325_marker_fm_transition_silver_HVG2000_benchmark_input.h5ad"
      gse230659: "benchmark/inputs/gse230659_marker_fm_transition_silver_hvg2000/GSE230659_marker_fm_transition_silver_HVG2000_benchmark_input.h5ad"
    output_dir: "results/test_outputs/server_dryrun"
    models_dir: "results/test_outputs/models"
  scvi:
    use_scvi: false
  trajectory:
    n_neighbors: 15
    n_pcs: 30

# =============================================================================
# PROFILE: local_real  (REAL prepped inputs, surrogate annotation, CPU, subsample)
# Proves the annotation-comparison + trajectory code runs on the ACTUAL
# reference/query data (the scANVI prep outputs) without scvi/GPU. Surrogate
# annotation; not a manuscript result, but real data end-to-end.
# =============================================================================
local_real:
  test_mode: true
  use_small_subset: true
  max_cells_per_dataset: 3000
  max_genes: null
  device: cpu
  paths:
    reference_h5ad: "results/annotation_branch/inputs/gse242424_ref_fullgene_labelled.h5ad"
    query_h5ad:
      gse178325: "results/annotation_branch/inputs/gse178325_query_fullgene_labelled.h5ad"
      gse230659: "results/annotation_branch/inputs/gse230659_query_fullgene_labelled.h5ad"
    output_dir: "results/test_outputs/local_real_run"
    models_dir: "results/test_outputs/models"
  scvi:
    use_scvi: false
  trajectory:
    n_neighbors: 15
    n_pcs: 30
