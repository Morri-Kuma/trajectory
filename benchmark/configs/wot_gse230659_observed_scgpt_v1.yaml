# wot_gse230659_observed_scgpt_v1.yaml
# WOT Lineage Fidelity configuration — Scenario A (observed-time, full dataset)
# STATE SYSTEM: scGPT v1 (silver-standard working, not final biology)
#
# Parallel scGPT-v1 config. Does NOT overwrite wot_gse230659_observed.yaml.
# Use this config to run WOT against the scGPT v1 state system.
#
# Entry point:
#   python benchmark/methods/WOT/run.py \
#       --config benchmark/configs/wot_gse230659_observed_scgpt_v1.yaml
#
# Capability flags (unchanged from original):
#   WOT: supports_unseen_timepoint_projection = False
#        supports_lineage_inference            = True
#   → evaluated on Lineage Fidelity only.
#   → Forecast Accuracy and Embedding Coherence are NOT run for WOT.
#
# What changes vs wot_gse230659_observed.yaml:
#   1. dataset.h5ad_path  → adata_scgpt_annotated.h5ad  (has scGPT obs columns)
#   2. dataset.time_key   → abs_day  (column name used in scGPT adatas)
#   3. lineage.cell_state_key → scgpt_pseudostate_provisional
#      (this IS the scGPT v1 pseudostate; the column was named "provisional"
#       at annotation time and renamed to "scgpt_pseudostate_v1" only in the
#       exported TSV — the h5ad obs column remains "scgpt_pseudostate_provisional")
#   4. lineage.reference_graph_path → scgpt_reference_graph_v1.json  (NOW ACTIVE)
#   5. lineage.edge_confidence_mode → medium_and_above  (conservative default)
#   6. output.base_dir   → benchmark/results/wot/scenario_A_scgpt_v1
#   7. run_id / scenario_name updated to reflect scGPT-v1 variant

# ---------------------------------------------------------------------------
# Run identity
# ---------------------------------------------------------------------------
run_id: wot_gse230659_A_scgpt_v1
method: wot
scenario: A
scenario_name: "Observed-time (full, scGPT-v1 state system)"
framework_version: v2

# ---------------------------------------------------------------------------
# State system provenance
# ---------------------------------------------------------------------------
state_system:
  version: "scgpt_v1"
  status: "silver_standard_working"
  n_states: 14
  n_graph_edges: 42
  source_h5ad: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  label_tsv: "benchmark/datasets/scgpt_pseudostate_v1.tsv"
  graph_json: "benchmark/datasets/scgpt_reference_graph_v1.json"
  graph_csv: "benchmark/datasets/scgpt_reference_graph_v1_edges.csv"
  note: >
    Working v1 silver-standard state system derived from scGPT embeddings
    (GSE230659, 75,194 cells). Not final biology. Acceptable for benchmark
    integration at current stage. See v1_export_metadata.json for full
    provenance.

# ---------------------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------------------
dataset:
  id: GSE230659
  # pkl_path points to a non-existent placeholder so run.py falls through
  # to h5ad_path below (the scGPT annotated adata is the canonical source here).
  pkl_path: "benchmark/datasets/scgpt_v1_no_pkl_placeholder.pkl"
  # h5ad_path: adata_scgpt_annotated.h5ad contains:
  #   - all 75,194 cells with X_scGPT, UMAP, Leiden clusters
  #   - obs columns: abs_day, scgpt_pseudostate_provisional,
  #                  scgpt_state_family, scgpt_state_status
  h5ad_path: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  # IMPORTANT: scGPT adatas use abs_day, NOT time_label.
  # The base benchmark adata (adata_benchmark.h5ad) uses time_label.
  # The scGPT pipeline preserved the raw h5ad column name: abs_day.
  time_key: abs_day

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  # New parallel output directory — does not overwrite scenario_A results.
  base_dir: "benchmark/results/wot/scenario_A_scgpt_v1"
  # Files written under base_dir/:
  #   state_transition_matrix.csv
  #   lineage_graph_edges.csv
  #   lineage_metrics.json       (written by eval_lineage.py after run.py)
  #   run_metadata.json
  #   tmaps/                     (WOT transport map h5ads)

# ---------------------------------------------------------------------------
# WOT transport-map parameters (unchanged from original config)
# ---------------------------------------------------------------------------
wot_params:
  epsilon: 0.05
  lambda1: 1.0
  lambda2: 50.0
  local_pca: 30
  growth_iters: 3
  ncells_subsample: null
  growth_rate_source: "uniform"

# ---------------------------------------------------------------------------
# State-transition matrix construction
# ---------------------------------------------------------------------------
lineage:
  # cell_state_key: the obs column in adata_scgpt_annotated.h5ad that holds
  # the scGPT v1 pseudostate label for each cell.
  #
  # NOTE ON NAMING:
  #   h5ad obs column → scgpt_pseudostate_provisional
  #   TSV export column → scgpt_pseudostate_v1
  # These are identical in content. The h5ad column was named "provisional"
  # at annotation time (annotate_provisional.py). The export_v1.py script
  # renames it to "scgpt_pseudostate_v1" in the TSV only — the h5ad is not
  # modified. Use the h5ad column name here.
  cell_state_key: "scgpt_pseudostate_provisional"
  cell_state_annotation_is_proxy: false      # this IS the v1 state system
  state_system_version: "scgpt_v1"

  # reference_graph_path: the v1 reference lineage graph (NOW ACTIVE).
  # Lineage Fidelity metrics will be computed against this graph.
  reference_graph_path: "benchmark/datasets/scgpt_reference_graph_v1.json"

  # edge_confidence_mode controls which edges from the reference graph are
  # used as ground truth for Lineage Fidelity evaluation.
  #
  # Options:
  #   "all"              — use all 42 edges (3 high + 28 medium + 11 low)
  #                        Most permissive; treats all transitions as ground truth.
  #   "medium_and_above" — exclude low-confidence edges (3 high + 28 medium = 31 edges)
  #                        RECOMMENDED for initial runs. Excludes edges involving
  #                        uncertain states (PS_11, PS_12) which are biologically
  #                        ambiguous.
  #   "high_only"        — use only 3 high-confidence edges (both endpoints confirmed)
  #                        Very conservative; useful for upper-bound signal check only.
  #
  # Default: medium_and_above
  edge_confidence_mode: "medium_and_above"

  # exclude_uncertain_states: if true, cells in uncertain states (PS_11, PS_12)
  # are excluded from the state-level aggregation step in WOT.
  # These 2,310 cells (3.1% of total) are biologically ambiguous.
  # Set to false to keep them in the state-level matrix but out of reference edges
  # (which is handled by edge_confidence_mode above).
  exclude_uncertain_states: false

# ---------------------------------------------------------------------------
# Evaluation (run after run.py completes)
# ---------------------------------------------------------------------------
evaluation:
  run_eval_lineage: true
  eval_script: "benchmark/evaluation/eval_lineage.py"
  # Lineage Fidelity metrics will be computed (reference_graph_path is set).
  # Status: "active" — not deferred.
