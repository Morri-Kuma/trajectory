# cellrank2_gse230659_observed_scgpt_v1_scenarioB.yaml
# CellRank2 Lineage Fidelity configuration — Scenario B (observed-time extrapolation)
# STATE SYSTEM: scGPT v1 (silver-standard working, not final biology)
#
# Parallel Scenario-B config. Mirror of wot_gse230659_observed_scgpt_v1_scenarioB.yaml
# for CellRank2. Does NOT overwrite any prior config.
#
# Entry point (via eval_dispatch.py):
#   python benchmark/evaluation/eval_dispatch.py \
#       --method cellrank2 \
#       --scenario B \
#       --adata benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad \
#       --output-dir benchmark/results/cellrank2/scenario_B_scgpt_v1 \
#       --method-config benchmark/configs/cellrank2_gse230659_observed_scgpt_v1_scenarioB.yaml
#
# STATUS (2026-04-20 cleanup pass):
# The CellRank2 adapter now honours scenario_params.train_times via a Step-0
# filter at the top of cellrank2_adapter.py::_run_lineage_fidelity_impl.
# eval_dispatch.py injects scenario_params from this method config into the
# scenario_config dict the adapter receives. Running this config will
# therefore produce a real Scenario-B CellRank2 result.
# No Scenario-B CellRank2 run has been launched yet as part of this cleanup
# pass; when one is run, its output must be classified per the pilot/official
# rules (any run launched with a subsample should be tagged as pilot in
# run_metadata.json so the summary script keeps it out of the official table).
#
# Capability flags (unchanged from Scenario A):
#   CellRank2: supports_unseen_timepoint_projection = False
#              supports_lineage_inference            = True

# ---------------------------------------------------------------------------
# Run identity
# ---------------------------------------------------------------------------
run_id: cellrank2_gse230659_B_scgpt_v1
method: cellrank2
scenario: B
scenario_name: "Observed-time extrapolation (early-only train, scGPT-v1 state system)"
framework_version: v2

# ---------------------------------------------------------------------------
# State system provenance (shared with Scenario A scGPT-v1 configs)
# ---------------------------------------------------------------------------
state_system:
  version: "scgpt_v1"
  status: "silver_standard_working"
  n_states: 14
  n_graph_edges: 42
  source_h5ad: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  label_tsv: "benchmark/datasets/scgpt_pseudostate_v1.tsv"
  graph_json: "benchmark/datasets/scgpt_reference_graph_v1.json"

# ---------------------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------------------
dataset:
  id: GSE230659
  h5ad_path: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  time_key: abs_day

# ---------------------------------------------------------------------------
# Scenario B time-split
# ---------------------------------------------------------------------------
# Matches the WOT Scenario-B config exactly so Scenario-B numbers between
# the two methods remain directly comparable once the CellRank2 adapter
# honours this field.
scenario_params:
  train_times: [0.5, 2.0, 4.0, 8.0, 12.0, 16.0]
  heldout_times: [16.33, 16.67, 17.0, 18.0, 20.0, 22.0, 24.0, 28.0, 30.0]

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  base_dir: "benchmark/results/cellrank2/scenario_B_scgpt_v1"

# ---------------------------------------------------------------------------
# CellRank2 kernel parameters (match Scenario A for comparability)
# ---------------------------------------------------------------------------
cellrank2_params:
  kernel: "RealTimeKernel"
  time_key: abs_day
  wot_params:
    epsilon: 0.05
    lambda1: 1.0
    lambda2: 50.0
    local_pca: 30
    growth_iters: 3
  gpcca_params:
    n_macrostates: 14
    use_state_labels: true

# ---------------------------------------------------------------------------
# State-transition matrix construction
# ---------------------------------------------------------------------------
lineage:
  cell_state_key: "scgpt_pseudostate_provisional"
  cell_state_annotation_is_proxy: false
  state_system_version: "scgpt_v1"
  reference_graph_path: "benchmark/datasets/scgpt_reference_graph_v1.json"
  edge_confidence_mode: "medium_and_above"
  exclude_uncertain_states: false

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  run_eval_lineage: true
  eval_script: "benchmark/evaluation/eval_lineage.py"
