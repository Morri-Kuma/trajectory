# cellrank2_gse230659_observed_scgpt_v1_scenarioC.yaml
# CellRank2 Lineage Fidelity configuration — Scenario C (observed-time interpolation + extrapolation)
# STATE SYSTEM: scGPT v1 (silver-standard working, not final biology)
#
# Parallel Scenario-C config. Mirror of wot_gse230659_observed_scgpt_v1_scenarioC.yaml
# for CellRank2. Does NOT overwrite any prior config.
#
# Entry point (via eval_dispatch.py):
#   python benchmark/evaluation/eval_dispatch.py \
#       --method cellrank2 \
#       --scenario C \
#       --adata benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad \
#       --output-dir benchmark/results/cellrank2/scenario_C_scgpt_v1 \
#       --method-config benchmark/configs/cellrank2_gse230659_observed_scgpt_v1_scenarioC.yaml
#
# Capability flags (unchanged from Scenario A/B):
#   CellRank2: supports_unseen_timepoint_projection = False
#              supports_lineage_inference            = True
#   → evaluated on Lineage Fidelity only.
#
# The CellRank2 adapter honours scenario_params.train_times via its Step-0
# filter. eval_dispatch.py injects scenario_params from this method config into
# the scenario_config dict the adapter receives. The same scenario-aware baseline
# logic applies: eval_dispatch.py passes adapter.adata (the filtered view) to
# run_lineage_evaluation(), so the correlation baseline is computed on the same
# 49,820-cell Scenario-C training split that the method used.
#
# Time-point split rationale: identical to the WOT Scenario C config.
# See wot_gse230659_observed_scgpt_v1_scenarioC.yaml for full documentation.

# ---------------------------------------------------------------------------
# Run identity
# ---------------------------------------------------------------------------
run_id: cellrank2_gse230659_C_scgpt_v1
method: cellrank2
scenario: C
scenario_name: "Observed-time interpolation+extrapolation (mixed train, scGPT-v1 state system)"
framework_version: v2

# ---------------------------------------------------------------------------
# State system provenance (shared with Scenario A/B scGPT-v1 configs)
# ---------------------------------------------------------------------------
state_system:
  version: "scgpt_v1"
  status: "silver_standard_working"
  n_states: 14
  n_graph_edges: 42
  source_h5ad: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  label_tsv: "benchmark/datasets/scgpt_pseudostate_v1.tsv"
  graph_json: "benchmark/datasets/scgpt_reference_graph_v1.json"
  graph_csv: "benchmark/datasets/scgpt_reference_graph_v1_edges.csv"

# ---------------------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------------------
dataset:
  id: GSE230659
  h5ad_path: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  time_key: abs_day

# ---------------------------------------------------------------------------
# Scenario C time-split
# ---------------------------------------------------------------------------
# Matches the WOT Scenario-C config exactly so Scenario-C numbers between
# the two methods remain directly comparable.
scenario_params:
  train_times: [0.5, 2.0, 8.0, 16.0, 16.33, 16.67, 17.0, 18.0, 22.0, 24.0]
  heldout_interpolation: [4.0, 12.0, 20.0]
  heldout_extrapolation: [28.0, 30.0]
  heldout_times: [4.0, 12.0, 20.0, 28.0, 30.0]
  n_train_cells_expected: 49820

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  base_dir: "benchmark/results/cellrank2/scenario_C_scgpt_v1"

# ---------------------------------------------------------------------------
# CellRank2 kernel parameters (match Scenario A/B for comparability)
# ---------------------------------------------------------------------------
cellrank2_params:
  kernel: "RealTimeKernel"
  time_key: abs_day
  wot_params:
    epsilon: 0.05
    lambda1: 1.0
    lambda2: 50.0
    local_pca: 30
    growth_iters: 3
  gpcca_params:
    n_macrostates: 14
    use_state_labels: true

# ---------------------------------------------------------------------------
# State-transition matrix construction
# ---------------------------------------------------------------------------
lineage:
  cell_state_key: "scgpt_pseudostate_provisional"
  cell_state_annotation_is_proxy: false
  state_system_version: "scgpt_v1"
  reference_graph_path: "benchmark/datasets/scgpt_reference_graph_v1.json"
  edge_confidence_mode: "medium_and_above"
  exclude_uncertain_states: false

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  run_eval_lineage: true
  eval_script: "benchmark/evaluation/eval_lineage.py"
  # Status: "active" — reference graph is wired up, scenario_params filter
  # is honoured by CellRank2Adapter Step 0. Baseline will be computed on
  # the 49,820-cell Scenario-C training split only (no full-data leakage).
