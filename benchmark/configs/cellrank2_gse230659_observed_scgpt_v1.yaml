# cellrank2_gse230659_observed_scgpt_v1.yaml
# CellRank2 Lineage Fidelity configuration — Scenario A (observed-time, full dataset)
# STATE SYSTEM: scGPT v1 (silver-standard working, not final biology)
#
# Parallel scGPT-v1 config. Mirror of wot_gse230659_observed_scgpt_v1.yaml
# for CellRank2. Does NOT overwrite any prior config.
# Use this config to run CellRank2 against the scGPT v1 state system.
#
# Entry point (via eval_dispatch.py):
#   python benchmark/evaluation/eval_dispatch.py \
#       --method cellrank2 \
#       --scenario A \
#       --adata benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad \
#       --output-dir benchmark/results/cellrank2/scenario_A_scgpt_v1 \
#       --method-config benchmark/configs/cellrank2_gse230659_observed_scgpt_v1.yaml
#
# Capability flags (unchanged):
#   CellRank2: supports_unseen_timepoint_projection = False
#              supports_lineage_inference            = True
#   → evaluated on Lineage Fidelity only.
#   → Forecast Accuracy and Embedding Coherence are NOT run for CellRank2.
#
# Status: CellRank2 adapter is scaffold-only (transition kernel not yet
# implemented). The reference graph wiring is now active so Lineage Fidelity
# metrics will be computed against scGPT-v1 once the adapter is implemented.

# ---------------------------------------------------------------------------
# Run identity
# ---------------------------------------------------------------------------
run_id: cellrank2_gse230659_A_scgpt_v1
method: cellrank2
scenario: A
scenario_name: "Observed-time (full, scGPT-v1 state system)"
framework_version: v2

# ---------------------------------------------------------------------------
# State system provenance (shared with WOT scGPT-v1 config)
# ---------------------------------------------------------------------------
state_system:
  version: "scgpt_v1"
  status: "silver_standard_working"
  n_states: 14
  n_graph_edges: 42
  source_h5ad: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  label_tsv: "benchmark/datasets/scgpt_pseudostate_v1.tsv"
  graph_json: "benchmark/datasets/scgpt_reference_graph_v1.json"
  graph_csv: "benchmark/datasets/scgpt_reference_graph_v1_edges.csv"
  note: >
    Working v1 silver-standard state system derived from scGPT embeddings
    (GSE230659, 75,194 cells). Not final biology. Acceptable for benchmark
    integration at current stage.

# ---------------------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------------------
dataset:
  id: GSE230659
  # adata_scgpt_annotated.h5ad contains:
  #   - all 75,194 cells with X_scGPT, UMAP, Leiden clusters
  #   - obs columns: abs_day, scgpt_pseudostate_provisional,
  #                  scgpt_state_family, scgpt_state_status
  h5ad_path: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  # IMPORTANT: scGPT adatas use abs_day, NOT time_label.
  time_key: abs_day

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  # New parallel output directory for CellRank2 scGPT-v1 run.
  base_dir: "benchmark/results/cellrank2/scenario_A_scgpt_v1"
  # Files written under base_dir/:
  #   state_transition_matrix.csv
  #   lineage_graph_edges.csv
  #   lineage_metrics.json
  #   run_metadata.json

# ---------------------------------------------------------------------------
# CellRank2 kernel parameters
# ---------------------------------------------------------------------------
cellrank2_params:
  # Primary kernel for the observed-time scenario.
  # RealTimeKernel is the appropriate CellRank2 kernel for data with
  # experimentally measured time points (abs_day).
  kernel: "RealTimeKernel"
  # time_key must match dataset.time_key above.
  time_key: abs_day
  # WOT transport map parameters used internally by RealTimeKernel.
  # These match the WOT scGPT-v1 config for comparability.
  wot_params:
    epsilon: 0.05
    lambda1: 1.0
    lambda2: 50.0
    local_pca: 30
    growth_iters: 3
  # GPCCA estimator parameters
  gpcca_params:
    n_macrostates: 14     # match number of scGPT v1 pseudostates
    # If GPCCA macrostates should be named using scgpt_pseudostate_provisional
    # labels, set use_state_labels to true and provide cell_state_key.
    use_state_labels: true
  # NOTE: Adapter is scaffold-only. These parameters are documented for
  # when the CellRank2 implementation is added.

# ---------------------------------------------------------------------------
# State-transition matrix construction
# ---------------------------------------------------------------------------
lineage:
  # cell_state_key: obs column in adata_scgpt_annotated.h5ad.
  # Same naming note as in wot_gse230659_observed_scgpt_v1.yaml:
  # h5ad column is "scgpt_pseudostate_provisional"; TSV export uses
  # "scgpt_pseudostate_v1". Both are the same data.
  cell_state_key: "scgpt_pseudostate_provisional"
  cell_state_annotation_is_proxy: false
  state_system_version: "scgpt_v1"

  # reference_graph_path: NOW ACTIVE for CellRank2 (previously null).
  reference_graph_path: "benchmark/datasets/scgpt_reference_graph_v1.json"

  # edge_confidence_mode: matches WOT config for direct comparability.
  # See wot_gse230659_observed_scgpt_v1.yaml for full documentation of options.
  edge_confidence_mode: "medium_and_above"

  exclude_uncertain_states: false

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  run_eval_lineage: true
  eval_script: "benchmark/evaluation/eval_lineage.py"
  # Status: "active" — reference_graph_path is now wired up.
  # Metrics will be deferred (nan) until the CellRank2 adapter produces
  # a real state_transition_matrix.csv (currently scaffold empty).
