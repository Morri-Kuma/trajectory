# wot_gse230659_observed_scgpt_v1_scenarioC.yaml
# WOT Lineage Fidelity configuration — Scenario C (observed-time interpolation + extrapolation)
# STATE SYSTEM: scGPT v1 (silver-standard working, not final biology)
#
# Parallel Scenario-C config. Does NOT overwrite Scenario A or B configs:
#   wot_gse230659_observed_scgpt_v1.yaml          (Scenario A — full observed-time)
#   wot_gse230659_observed_scgpt_v1_scenarioB.yaml (Scenario B — extrapolation only)
#   wot_gse230659_observed_scgpt_v1_scenarioC.yaml (this file, Scenario C — combined)
#
# Entry point:
#   python benchmark/methods/WOT/run.py \
#       --config benchmark/configs/wot_gse230659_observed_scgpt_v1_scenarioC.yaml
#
# Capability flags (unchanged from Scenario A/B):
#   WOT: supports_unseen_timepoint_projection = False
#        supports_lineage_inference            = True
#   → evaluated on Lineage Fidelity only.
#
# What changes vs the Scenario-B scGPT-v1 config:
#   1. scenario:        B  →  C
#   2. scenario_name:   updated to reflect Scenario C
#   3. scenario_params.train_times: a mixed train set that holds out both
#      internal time points (interpolation challenge) and terminal time points
#      (extrapolation challenge). See "Time-point split rationale" below.
#   4. output.base_dir → benchmark/results/wot/scenario_C_scgpt_v1
#   5. run_id updated to reflect Scenario C.
#
# Time-point split rationale
# --------------------------
# GSE230659 has 15 abs_day values and cell counts:
#   0.50:  6,217  |  2.00:  4,168  |  4.00:    522  |  8.00:  5,385
#  12.00:  5,985  | 16.00:  5,614  | 16.33:  6,165  | 16.67:  2,827
#  17.00:  4,869  | 18.00:  6,953  | 20.00:  4,481  | 22.00:  3,416
#  24.00:  4,206  | 28.00:  5,244  | 30.00:  9,142
#  Total: 75,194
#
# Scenario C design:
#   train_times (10 time points, 49,820 cells, 9 consecutive WOT pairs):
#     [0.5, 2.0, 8.0, 16.0, 16.33, 16.67, 17.0, 18.0, 22.0, 24.0]
#
#   heldout_interpolation — internal gaps (3 time points, 10,988 cells):
#     [4.0, 12.0, 20.0]
#     - day 4.0  (522 cells):  early somatic → early-transition gap
#     - day 12.0 (5,985 cells): mid-transition gap
#     - day 20.0 (4,481 cells): late-transition gap
#
#   heldout_extrapolation — terminal points never seen in training (2 time points, 14,386 cells):
#     [28.0, 30.0]
#     - day 28.0 (5,244 cells): near-terminal pluripotent
#     - day 30.0 (9,142 cells): terminal hCiPSC (pluripotent)
#
#   WOT consecutive training pairs (9 pairs):
#     0.5→2.0  |  2.0→8.0 [gap:4.0]  |  8.0→16.0 [gap:12.0]  |  16.0→16.33
#     16.33→16.67  |  16.67→17.0  |  17.0→18.0  |  18.0→22.0 [gap:20.0]  |  22.0→24.0
#
# Why this split is appropriate:
#   1. Interpolation challenge: holding out days 4.0, 12.0, and 20.0 removes cells
#      from three distinct phases of the reprogramming trajectory (early, mid, and
#      late transition). WOT must bridge larger temporal gaps than in Scenario A
#      across each of these phases.
#   2. Extrapolation challenge: holding out days 28.0 and 30.0 means the method
#      has never seen the terminal pluripotent state during training, directly
#      parallel to Scenario B's extrapolation structure.
#   3. Strict superset of challenges vs Scenarios A and B: Scenario A had no held-out
#      points; Scenario B had extrapolation only. Scenario C combines both, making it
#      strictly harder for lineage recovery.
#   4. Sufficient training data: 49,820 training cells (66.3% of total) across
#      10 time points ensures WOT has adequate data for transport map computation.
#      This is substantially more than Scenario B's 27,891 cells.
#   5. Comparable reference: same scGPT v1 reference graph and edge_confidence_mode
#      as Scenarios A and B — results are directly comparable across scenarios.

# ---------------------------------------------------------------------------
# Run identity
# ---------------------------------------------------------------------------
run_id: wot_gse230659_C_scgpt_v1
method: wot
scenario: C
scenario_name: "Observed-time interpolation+extrapolation (mixed train, scGPT-v1 state system)"
framework_version: v2

# ---------------------------------------------------------------------------
# State system provenance (shared with Scenario A/B scGPT-v1 configs)
# ---------------------------------------------------------------------------
state_system:
  version: "scgpt_v1"
  status: "silver_standard_working"
  n_states: 14
  n_graph_edges: 42
  source_h5ad: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  label_tsv: "benchmark/datasets/scgpt_pseudostate_v1.tsv"
  graph_json: "benchmark/datasets/scgpt_reference_graph_v1.json"
  graph_csv: "benchmark/datasets/scgpt_reference_graph_v1_edges.csv"

# ---------------------------------------------------------------------------
# Dataset (same source as Scenario A/B; runner applies the time-split filter)
# ---------------------------------------------------------------------------
dataset:
  id: GSE230659
  pkl_path: "benchmark/datasets/scgpt_v1_no_pkl_placeholder.pkl"
  h5ad_path: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  time_key: abs_day

# ---------------------------------------------------------------------------
# Scenario C time-split (read by benchmark/methods/WOT/run.py)
# ---------------------------------------------------------------------------
scenario_params:
  # Cells with abs_day NOT in this list are removed before WOT fitting.
  # 10 time points, 49,820 cells, 9 consecutive WOT pairs.
  train_times: [0.5, 2.0, 8.0, 16.0, 16.33, 16.67, 17.0, 18.0, 22.0, 24.0]
  # Documented for traceability; not used by the WOT runner or evaluator.
  heldout_interpolation: [4.0, 12.0, 20.0]
  heldout_extrapolation: [28.0, 30.0]
  # Combined heldout for reference:
  heldout_times: [4.0, 12.0, 20.0, 28.0, 30.0]
  n_train_cells_expected: 49820

# ---------------------------------------------------------------------------
# Output (separate directory; Scenario A and B outputs are not touched)
# ---------------------------------------------------------------------------
output:
  base_dir: "benchmark/results/wot/scenario_C_scgpt_v1"

# ---------------------------------------------------------------------------
# WOT transport-map parameters (unchanged from Scenario A/B for comparability)
# ---------------------------------------------------------------------------
wot_params:
  epsilon: 0.05
  lambda1: 1.0
  lambda2: 50.0
  local_pca: 30
  growth_iters: 3
  ncells_subsample: null
  growth_rate_source: "uniform"

# ---------------------------------------------------------------------------
# State-transition matrix construction
# ---------------------------------------------------------------------------
lineage:
  cell_state_key: "scgpt_pseudostate_provisional"
  cell_state_annotation_is_proxy: false
  state_system_version: "scgpt_v1"
  reference_graph_path: "benchmark/datasets/scgpt_reference_graph_v1.json"
  edge_confidence_mode: "medium_and_above"
  exclude_uncertain_states: false

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  run_eval_lineage: true
  eval_script: "benchmark/evaluation/eval_lineage.py"
  # Status: "active" — reference graph is wired up.
  # Scenario C lineage metrics reflect that WOT only saw cells from 10 of 15
  # time points; both interpolation and extrapolation gaps in the training split
  # will affect the quality of recovered lineage edges.
