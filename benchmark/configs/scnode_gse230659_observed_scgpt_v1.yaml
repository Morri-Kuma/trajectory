# scnode_gse230659_observed_scgpt_v1.yaml
# scNODE benchmark configuration — Scenario A (observed-time, all timepoints)
# STATE SYSTEM: scGPT v1 (silver-standard working, not final biology)
#
# Entry point:
#   python benchmark/methods/scNODE/run.py \
#       --config benchmark/configs/scnode_gse230659_observed_scgpt_v1.yaml
#
#   Or via train_and_test.sh (called from benchmark/):
#       bash benchmark/methods/scNODE/train_and_test.sh \
#           benchmark/configs/scnode_gse230659_observed_scgpt_v1.yaml
#
# Capability flags (per experimental framework v2.md §6):
#   scNODE: supports_unseen_timepoint_projection = True
#           supports_lineage_inference            = True
#   → evaluated on ALL three benchmark dimensions:
#       Forecast Accuracy, Embedding Coherence, Lineage Fidelity
#
# Scenario A: no time-point hold-out. All 15 observed abs_day values are
# used for training (75,194 cells). Forecast and Embedding are evaluated as
# within-distribution reconstruction checks. Lineage Fidelity is evaluated
# against the scGPT v1 reference graph.

# ---------------------------------------------------------------------------
# Run identity
# ---------------------------------------------------------------------------
run_id: scnode_gse230659_A_scgpt_v1
method: scnode
scenario: A
scenario_name: "Observed-time (full, scGPT-v1 state system)"
framework_version: v2

# ---------------------------------------------------------------------------
# State system provenance (shared with WOT / CellRank2 scGPT-v1 configs)
# ---------------------------------------------------------------------------
state_system:
  version: "scgpt_v1"
  status: "silver_standard_working"
  n_states: 14
  n_graph_edges: 42
  source_h5ad: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  label_tsv: "benchmark/datasets/scgpt_pseudostate_v1.tsv"
  graph_json: "benchmark/datasets/scgpt_reference_graph_v1.json"
  graph_csv: "benchmark/datasets/scgpt_reference_graph_v1_edges.csv"
  note: >
    Working v1 silver-standard state system derived from scGPT embeddings
    (GSE230659, 75,194 cells). Not final biology. Acceptable for benchmark
    integration at current stage. See v1_export_metadata.json for full
    provenance.

# ---------------------------------------------------------------------------
# Ground-truth provider
# ---------------------------------------------------------------------------
ground_truth:
  provider_id: "scgpt_v1"
  state_key: "scgpt_pseudostate_provisional"
  confidence_mode: "medium_and_above"
  exclude_uncertain_states: false

# ---------------------------------------------------------------------------
# Dataset
# ---------------------------------------------------------------------------
dataset:
  id: GSE230659
  # adata_scgpt_annotated.h5ad contains:
  #   - all 75,194 cells with X_scGPT, UMAP, Leiden clusters
  #   - obs columns: abs_day, scgpt_pseudostate_provisional,
  #                  scgpt_state_family, scgpt_state_status
  # IMPORTANT: scGPT adatas use abs_day, NOT time_label.
  h5ad_path: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  time_key: abs_day

# ---------------------------------------------------------------------------
# Scenario A: no time-point filter (train on all 15 time points)
# ---------------------------------------------------------------------------
# scenario_params not needed for Scenario A — run.py uses all tps by default.

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  # Parallel output directory; does not overwrite WOT / CellRank2 results.
  base_dir: "benchmark/results/scnode/scenario_A_scgpt_v1"
  # Files written under base_dir/:
  #   trained_scnode_model.pth           (model cache; reused on rerun)
  #   projected_expression.npy           (Forecast Accuracy)
  #   forecast_metrics.json
  #   per_timepoint_forecast_metrics.csv
  #   projected_embedding.npy            (Embedding Coherence)
  #   embedding_metrics.json
  #   projected_cluster_labels.csv
  #   state_transition_matrix.csv        (Lineage Fidelity)
  #   lineage_graph_edges.csv
  #   lineage_metrics.json
  #   run_metadata.json

# ---------------------------------------------------------------------------
# scNODE model hyperparameters
# ---------------------------------------------------------------------------
scnode_params:
  # Latent space dimensionality
  latent_dim: 50
  # ODE drift network hidden layers
  drift_latent_size: [50, 50]
  # VAE encoder hidden layers
  enc_latent_list: [64, 64]
  # VAE decoder hidden layers
  dec_latent_list: [64, 64]
  # VAE pre-training iterations (warms up encoder/decoder before ODE training)
  pretrain_iters: 200
  # ODE training epochs
  epochs: 10
  # Gradient steps per epoch
  iters: 100
  # Batch size for ODE training
  batch_size: 32
  # Learning rate (Adam)
  lr: 1.0e-3
  # Dynamic regularization coefficient (beta in the paper)
  latent_coeff: 1.0
  # KL divergence coefficient (0 = no KL term; standard for scNODE)
  kl_coeff: 0.0
  # Random seed for reproducibility
  seed: 42
  # Number of simulated cells at inference time.
  # null = auto (capped at n_sim_cells_cap=2000, using actual t0 cell count).
  # Override with an integer if you want a fixed count.
  n_sim_cells: null

# ---------------------------------------------------------------------------
# State-transition matrix construction (Lineage Fidelity)
# ---------------------------------------------------------------------------
lineage:
  # cell_state_key: obs column in adata_scgpt_annotated.h5ad.
  # NOTE ON NAMING:
  #   h5ad obs column → scgpt_pseudostate_provisional
  #   TSV export column → scgpt_pseudostate_v1
  # These are identical in content. Use the h5ad column name here.
  cell_state_key: "scgpt_pseudostate_provisional"
  cell_state_annotation_is_proxy: false
  state_system_version: "scgpt_v1"

  # reference_graph_path: scGPT v1 reference lineage graph (ACTIVE).
  reference_graph_path: "benchmark/datasets/scgpt_reference_graph_v1.json"

  # edge_confidence_mode: which reference edges are used as ground truth.
  #   "all"              — all 42 edges (3 high + 28 medium + 11 low)
  #   "medium_and_above" — 31 edges (3 high + 28 medium) [RECOMMENDED]
  #   "high_only"        — 3 high-confidence edges only
  edge_confidence_mode: "medium_and_above"

  # exclude_uncertain_states: if true, exclude PS_11 / PS_12 cells from
  # the state-level aggregation. Set false to keep them in the STM
  # (edge_confidence_mode already excludes uncertain edges).
  exclude_uncertain_states: false

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  run_eval_lineage: true
  eval_script: "benchmark/evaluation/eval_lineage.py"
  # Forecast Accuracy and Embedding Coherence are run inside run.py directly
  # (scNODE is a generative model, eligible for all three dimensions).
  # Lineage Fidelity metrics are computed by eval_lineage.py after STM is built.
  status: "active"
