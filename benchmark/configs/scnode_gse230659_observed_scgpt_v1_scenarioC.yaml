# scnode_gse230659_observed_scgpt_v1_scenarioC.yaml
# scNODE benchmark configuration — Scenario C (observed-time interpolation + extrapolation)
# STATE SYSTEM: scGPT v1 (silver-standard working, not final biology)
#
# Entry point:
#   python benchmark/methods/scNODE/run.py \
#       --config benchmark/configs/scnode_gse230659_observed_scgpt_v1_scenarioC.yaml
#
# Capability flags (unchanged from Scenario A/B):
#   scNODE: supports_unseen_timepoint_projection = True
#           supports_lineage_inference            = True
#   → evaluated on ALL three benchmark dimensions.
#
# What changes vs Scenario B:
#   1. scenario:        B  →  C
#   2. scenario_name:   updated to reflect mixed interpolation + extrapolation
#   3. scenario_params.train_times: mixed set (see split below)
#   4. scenario_params.heldout_times: combined interpolation + extrapolation holdouts
#   5. output.base_dir → benchmark/results/scnode/scenario_C_scgpt_v1
#   6. run_id updated to reflect Scenario C
#
# Time-point split (mirrors wot_gse230659_observed_scgpt_v1_scenarioC.yaml)
# --------------------------------------------------------------------------
# GSE230659 has 15 abs_day values and cell counts:
#   0.50:  6,217  |  2.00:  4,168  |  4.00:    522  |  8.00:  5,385
#  12.00:  5,985  | 16.00:  5,614  | 16.33:  6,165  | 16.67:  2,827
#  17.00:  4,869  | 18.00:  6,953  | 20.00:  4,481  | 22.00:  3,416
#  24.00:  4,206  | 28.00:  5,244  | 30.00:  9,142
#  Total: 75,194
#
# Scenario C design:
#   train_times (10 time points, 49,820 cells, 9 consecutive ODE pairs):
#     [0.5, 2.0, 8.0, 16.0, 16.33, 16.67, 17.0, 18.0, 22.0, 24.0]
#
#   heldout_interpolation (3 time points, internal gaps):
#     [4.0, 12.0, 20.0]
#     - day 4.0  (522 cells):   early somatic → early-transition gap
#     - day 12.0 (5,985 cells): mid-transition gap
#     - day 20.0 (4,481 cells): late-transition gap
#
#   heldout_extrapolation (2 time points, terminal, never seen in training):
#     [28.0, 30.0]
#     - day 28.0 (5,244 cells): near-terminal pluripotent
#     - day 30.0 (9,142 cells): terminal hCiPSC (pluripotent)
#
#   heldout_times = [4.0, 12.0, 20.0, 28.0, 30.0]   (25,374 cells held out)
#
# For scNODE specifically:
#   - The model is TRAINED on the 10 train_times time points.
#   - Forecast Accuracy: ODE both interpolates (days 4, 12, 20) and
#     extrapolates (days 28, 30); predicted cells compared against observed.
#   - Embedding Coherence: ODE latent at all held-out time points; nearest-
#     centroid assignment uses centroids from all observed cells (adata_full).
#   - Lineage Fidelity: evaluated on the 9 consecutive training-time transitions.
#
# This is strictly harder than both Scenario A (no holdouts) and Scenario B
# (extrapolation only). Results are directly comparable across scenarios
# because the same reference graph and edge_confidence_mode are used.

# ---------------------------------------------------------------------------
# Run identity
# ---------------------------------------------------------------------------
run_id: scnode_gse230659_C_scgpt_v1
method: scnode
scenario: C
scenario_name: "Observed-time interpolation+extrapolation (mixed train, scGPT-v1 state system)"
framework_version: v2

# ---------------------------------------------------------------------------
# State system provenance (shared with all scGPT-v1 configs)
# ---------------------------------------------------------------------------
state_system:
  version: "scgpt_v1"
  status: "silver_standard_working"
  n_states: 14
  n_graph_edges: 42
  source_h5ad: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  label_tsv: "benchmark/datasets/scgpt_pseudostate_v1.tsv"
  graph_json: "benchmark/datasets/scgpt_reference_graph_v1.json"
  graph_csv: "benchmark/datasets/scgpt_reference_graph_v1_edges.csv"

# ---------------------------------------------------------------------------
# Dataset (same source as Scenario A/B; runner applies the time-split filter)
# ---------------------------------------------------------------------------
dataset:
  id: GSE230659
  h5ad_path: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  time_key: abs_day

# ---------------------------------------------------------------------------
# Scenario C time-split (read by benchmark/methods/scNODE/run.py)
# ---------------------------------------------------------------------------
scenario_params:
  # Cells with abs_day NOT in train_times are removed before model training.
  # 10 time points, 49,820 cells, 9 consecutive ODE integration pairs.
  train_times: [0.5, 2.0, 8.0, 16.0, 16.33, 16.67, 17.0, 18.0, 22.0, 24.0]
  # heldout_interpolation: documented for traceability (subset of heldout_times)
  heldout_interpolation: [4.0, 12.0, 20.0]
  # heldout_extrapolation: documented for traceability (subset of heldout_times)
  heldout_extrapolation: [28.0, 30.0]
  # heldout_times: combined list used by run_forecast_accuracy and
  # run_embedding_coherence to build the full ODE integration axis.
  heldout_times: [4.0, 12.0, 20.0, 28.0, 30.0]
  n_train_cells_expected: 49820

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  # Separate directory; Scenario A and B outputs are not touched.
  base_dir: "benchmark/results/scnode/scenario_C_scgpt_v1"

# ---------------------------------------------------------------------------
# scNODE model hyperparameters (unchanged from Scenario A/B for comparability)
# ---------------------------------------------------------------------------
scnode_params:
  latent_dim: 50
  drift_latent_size: [50, 50]
  enc_latent_list: [64, 64]
  dec_latent_list: [64, 64]
  pretrain_iters: 200
  epochs: 10
  iters: 100
  batch_size: 32
  lr: 1.0e-3
  latent_coeff: 1.0
  kl_coeff: 0.0
  seed: 42
  n_sim_cells: null

# ---------------------------------------------------------------------------
# State-transition matrix construction (Lineage Fidelity)
# ---------------------------------------------------------------------------
lineage:
  cell_state_key: "scgpt_pseudostate_provisional"
  cell_state_annotation_is_proxy: false
  state_system_version: "scgpt_v1"
  reference_graph_path: "benchmark/datasets/scgpt_reference_graph_v1.json"
  edge_confidence_mode: "medium_and_above"
  exclude_uncertain_states: false

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  run_eval_lineage: true
  eval_script: "benchmark/evaluation/eval_lineage.py"
  # Scenario C Lineage Fidelity reflects training on 10 of 15 time points.
  # Both interpolation and extrapolation gaps affect lineage recovery quality.
  # Forecast Accuracy covers both interpolation (days 4, 12, 20) and
  # extrapolation (days 28, 30) held-out timepoints.
  status: "active"
