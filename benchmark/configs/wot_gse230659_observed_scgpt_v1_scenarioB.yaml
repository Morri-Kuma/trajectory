# wot_gse230659_observed_scgpt_v1_scenarioB.yaml
# WOT Lineage Fidelity configuration — Scenario B (observed-time extrapolation)
# STATE SYSTEM: scGPT v1 (silver-standard working, not final biology)
#
# Parallel Scenario-B config. Does NOT overwrite Scenario A configs:
#   wot_gse230659_observed_scgpt_v1.yaml          (Scenario A)
#   wot_gse230659_observed_scgpt_v1_scenarioB.yaml (this file, Scenario B)
#
# Entry point:
#   python benchmark/methods/WOT/run.py \
#       --config benchmark/configs/wot_gse230659_observed_scgpt_v1_scenarioB.yaml
#
# Capability flags (unchanged from Scenario A):
#   WOT: supports_unseen_timepoint_projection = False
#        supports_lineage_inference            = True
#   → evaluated on Lineage Fidelity only.
#
# What changes vs the Scenario-A scGPT-v1 config:
#   1. scenario:        A  →  B
#   2. scenario_name:   "Observed-time (full, scGPT-v1 state system)"
#                       → "Observed-time extrapolation (early-only, scGPT-v1)"
#   3. NEW scenario_params.train_times: only the early reprogramming days
#      are used to fit WOT. Late time points are *held out*. The runner
#      filters train_adata to only those cells before invoking OTModel.
#   4. output.base_dir → benchmark/results/wot/scenario_B_scgpt_v1
#   5. run_id updated to reflect Scenario B.
#
# Time-point split rationale
# --------------------------
# GSE230659 has 15 abs_day values: 0.5, 2, 4, 8, 12, 16, 16.33, 16.67, 17,
# 18, 20, 22, 24, 28, 30. Late states (PS_00, PS_01, PS_04, PS_05, PS_08,
# PS_10) emerge at day 16.33 onwards and dominate days 18+. Holding out
# everything from day 16.33 onwards is the strongest extrapolation cut and
# preserves the 6 earliest time points (~30,129 cells) for training.
#   train_times   = [0.5, 2.0, 4.0, 8.0, 12.0, 16.0]
#   heldout_times = [16.33, 16.67, 17.0, 18.0, 20.0, 22.0, 24.0, 28.0, 30.0]
#
# The reference graph and edge_confidence_mode are unchanged so Scenario B
# numbers are directly comparable to Scenario A.

# ---------------------------------------------------------------------------
# Run identity
# ---------------------------------------------------------------------------
run_id: wot_gse230659_B_scgpt_v1
method: wot
scenario: B
scenario_name: "Observed-time extrapolation (early-only train, scGPT-v1 state system)"
framework_version: v2

# ---------------------------------------------------------------------------
# State system provenance (shared with Scenario A scGPT-v1 configs)
# ---------------------------------------------------------------------------
state_system:
  version: "scgpt_v1"
  status: "silver_standard_working"
  n_states: 14
  n_graph_edges: 42
  source_h5ad: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  label_tsv: "benchmark/datasets/scgpt_pseudostate_v1.tsv"
  graph_json: "benchmark/datasets/scgpt_reference_graph_v1.json"
  graph_csv: "benchmark/datasets/scgpt_reference_graph_v1_edges.csv"

# ---------------------------------------------------------------------------
# Dataset (same source as Scenario A; runner applies the time-split filter)
# ---------------------------------------------------------------------------
dataset:
  id: GSE230659
  pkl_path: "benchmark/datasets/scgpt_v1_no_pkl_placeholder.pkl"
  h5ad_path: "benchmark/results/scgpt/full/adata_scgpt_annotated.h5ad"
  time_key: abs_day

# ---------------------------------------------------------------------------
# Scenario B time-split (read by benchmark/methods/WOT/run.py)
# ---------------------------------------------------------------------------
scenario_params:
  # Cells with abs_day NOT in this list are removed before WOT fitting.
  train_times: [0.5, 2.0, 4.0, 8.0, 12.0, 16.0]
  # heldout_times is documented for traceability; the lineage evaluator
  # does not need it (lineage fidelity is evaluated against the frozen
  # reference graph, which spans all time points).
  heldout_times: [16.33, 16.67, 17.0, 18.0, 20.0, 22.0, 24.0, 28.0, 30.0]

# ---------------------------------------------------------------------------
# Output (separate directory; Scenario A outputs are not touched)
# ---------------------------------------------------------------------------
output:
  base_dir: "benchmark/results/wot/scenario_B_scgpt_v1"

# ---------------------------------------------------------------------------
# WOT transport-map parameters (unchanged from Scenario A for comparability)
# ---------------------------------------------------------------------------
wot_params:
  epsilon: 0.05
  lambda1: 1.0
  lambda2: 50.0
  local_pca: 30
  growth_iters: 3
  ncells_subsample: null
  growth_rate_source: "uniform"

# ---------------------------------------------------------------------------
# State-transition matrix construction
# ---------------------------------------------------------------------------
lineage:
  cell_state_key: "scgpt_pseudostate_provisional"
  cell_state_annotation_is_proxy: false
  state_system_version: "scgpt_v1"
  reference_graph_path: "benchmark/datasets/scgpt_reference_graph_v1.json"
  edge_confidence_mode: "medium_and_above"
  exclude_uncertain_states: false

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  run_eval_lineage: true
  eval_script: "benchmark/evaluation/eval_lineage.py"
  # Status: "active" — reference graph is wired up. Metrics will reflect the
  # fact that WOT only saw early time points; late-only edges in the reference
  # graph cannot be discovered by construction, so Scenario B is expected to
  # score below Scenario A.
