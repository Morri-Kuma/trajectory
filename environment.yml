# Conda environment for the annotation-robustness branch.
# Core deps run the unit tests + the local (surrogate) pipeline on a laptop.
# scvi-tools + a CUDA torch are only needed for the real scANVI server run.
name: trajectory-annotation
channels: [conda-forge, bioconda]
dependencies:
  - python=3.10
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - anndata>=0.11
  - matplotlib>=3.7
  - pyyaml>=6.0
  - h5py>=3.7
  - pytest>=7.0
  # recommended: production preprocessing / trajectory (auto-used if present)
  - scanpy>=1.10
  - leidenalg>=0.10
  - python-igraph>=0.11
  - umap-learn>=0.5
  - pip
  - pip:
      # full / server: real scANVI + scArches reference mapping
      - scvi-tools>=1.1
      # install a torch build matching your CUDA separately, e.g.:
      #   pip install torch --index-url https://download.pytorch.org/whl/cu121
